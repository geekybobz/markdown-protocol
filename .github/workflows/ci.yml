name: Package CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete package verification
        run: python scripts/verify_package.py
      - name: Verify installed command
        run: |
          python -m pip install --disable-pip-version-check .
          mdp version
          mdp doctor . --format json
